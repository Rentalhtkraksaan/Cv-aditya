<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berikan Rating - Aditya Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000c18;
            --primary-color: #00d2ff;
            --secondary-color: #3a7bd5;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --star-inactive: rgba(255, 255, 255, 0.2);
            --star-active: #ffb400;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 210, 255, 0.1) 0%, transparent 60%);
            padding: 80px 20px 40px; /* Padding top ditambah untuk ruang tombol */
        }

        /* PERBAIKAN TOMBOL KEMBALI */
        .back-btn {
            position: fixed; /* Diubah ke fixed agar selalu di depan */
            top: 25px;
            left: 25px;
            z-index: 100; /* Memastikan di atas elemen lain */
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            color: var(--primary-color);
            background: rgba(0, 210, 255, 0.1);
            transform: translateX(-5px);
        }

        .rating-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
            text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .rating-card h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .rating-card h2 span {
            color: var(--primary-color);
        }

        .rating-card p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        /* Stars Container */
        .stars {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-direction: row-reverse;
        }

        .stars input {
            display: none;
        }

        .stars label {
            font-size: 3rem;
            color: var(--star-inactive);
            cursor: pointer;
            transition: all 0.2s ease;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .stars label:hover,
        .stars label:hover ~ label,
        .stars input:checked ~ label {
            color: var(--star-active);
            text-shadow: 0 0 20px rgba(255, 180, 0, 0.6);
            transform: scale(1.1);
        }

        .stars label:active {
            transform: scale(0.9);
        }

        /* Form Elements */
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .feedback-group {
            margin-bottom: 20px;
            text-align: left;
            flex: 1;
        }

        .feedback-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .feedback-group input,
        .feedback-group textarea {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 12px 15px;
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .feedback-group textarea {
            resize: none;
            height: 100px;
        }

        .feedback-group input:focus,
        .feedback-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 210, 255, 0.4);
        }

        /* Success Overlay */
        .success-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-color);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 10;
        }

        .success-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .success-icon {
            font-size: 4rem;
            color: var(--primary-color);
            margin-bottom: 20px;
            text-shadow: 0 0 20px var(--primary-color);
            transform: scale(0);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s;
        }

        .success-overlay.active .success-icon {
            transform: scale(1);
        }

        .success-overlay h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .success-overlay p {
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .btn-home {
            padding: 10px 25px;
            background: transparent;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-home:hover {
            background: var(--primary-color);
            color: #000;
        }

        /* RESPONSIVE MOBILE */
        @media (max-width: 600px) {
            body {
                align-items: flex-start; /* Card tidak di tengah vertikal agar mudah di-scroll */
                padding-top: 90px;
            }
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            .back-btn {
                top: 15px;
                left: 15px;
                font-size: 0.9rem;
            }
            .rating-card {
                padding: 25px 20px;
            }
            .stars label {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <a href="data.html#reviews" class="back-btn">
        <i class="fas fa-arrow-left"></i> Kembali
    </a>

    <div class="rating-card">
        <h2>Penilaian <span>Anda</span></h2>
        <p>Ulasan Anda akan langsung ditampilkan di halaman utama kami.</p>

        <form id="ratingForm">
            <div class="stars">
                <input type="radio" name="rating" id="star5" value="5">
                <label for="star5"><i class="fas fa-star"></i></label>
                
                <input type="radio" name="rating" id="star4" value="4">
                <label for="star4"><i class="fas fa-star"></i></label>
                
                <input type="radio" name="rating" id="star3" value="3">
                <label for="star3"><i class="fas fa-star"></i></label>
                
                <input type="radio" name="rating" id="star2" value="2">
                <label for="star2"><i class="fas fa-star"></i></label>
                
                <input type="radio" name="rating" id="star1" value="1">
                <label for="star1"><i class="fas fa-star"></i></label>
            </div>

            <div class="form-row">
                <div class="feedback-group">
                    <label for="reviewerName">Nama Anda</label>
                    <input type="text" id="reviewerName" placeholder="Contoh: John Doe" required>
                </div>
                <div class="feedback-group">
                    <label for="reviewerRole">Jabatan / Instansi</label>
                    <input type="text" id="reviewerRole" placeholder="Contoh: Klien" required>
                </div>
            </div>

            <div class="feedback-group">
                <label for="feedbackMsg">Ulasan Publik</label>
                <textarea id="feedbackMsg" placeholder="Sangat direkomendasikan karena..." required></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Kirim Publik</button>
        </form>

        <div class="success-overlay" id="successOverlay">
            <i class="fas fa-check-circle success-icon"></i>
            <h3>Berhasil Ditambahkan!</h3>
            <p>Ulasan Anda telah tersimpan di sistem.</p>
            <a href="data.html#reviews" class="btn-home">Kembali ke Portofolio</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcQuP2GFUgljflnmhRZEKtB4R8Zr9ye6Y",
            authDomain: "cwu-ii-3ae88.firebaseapp.com",
            databaseURL: "https://cwu-ii-3ae88-default-rtdb.firebaseio.com",
            projectId: "cwu-ii-3ae88",
            storageBucket: "cwu-ii-3ae88.firebasestorage.app",
            messagingSenderId: "259906078778",
            appId: "1:259906078778:web:3e289947bf2e6b27ce0d03",
            measurementId: "G-VMF1P71R5Z"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const form = document.getElementById('ratingForm');
        const submitBtn = document.getElementById('submitBtn');
        const overlay = document.getElementById('successOverlay');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const ratingSelected = document.querySelector('input[name="rating"]:checked');
            
            if (!ratingSelected) {
                alert('Silakan pilih jumlah bintang!');
                return;
            }

            submitBtn.textContent = 'Memproses...';
            submitBtn.disabled = true;

            const newReview = {
                nama: document.getElementById('reviewerName').value,
                bidang: document.getElementById('reviewerRole').value,
                rating: parseInt(ratingSelected.value),
                pesan: document.getElementById('feedbackMsg').value,
                waktu: Date.now(),
                kategori: "umum",
                hidden: false,
                pinned: 0
            };

            try {
                const newRatingRef = push(ref(db, 'ratings'));
                await set(newRatingRef, newReview);
                overlay.classList.add('active');
            } catch (error) {
                console.error(error);
                alert("Gagal mengirim ulasan.");
                submitBtn.textContent = 'Kirim Publik';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
